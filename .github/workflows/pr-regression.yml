name: PR Regression Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      story:
        description: 'Regression story override'
        required: false
        default: 'GST validation changed for product creation'
      uniware_pr:
        description: 'Optional Uniware PR number to analyze'
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Run PR Regression Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          STORY="${{ github.event.inputs.story }}"
          if [ -z "$STORY" ]; then
            STORY="PR regression for #${{ github.event.pull_request.number }}"
          fi

          CMD="node agents/runRegression.js --story \"$STORY\" --pr ${{ github.event.pull_request.number }}"

          if [ -n "${{ github.event.inputs.uniware_pr }}" ]; then
            CMD="$CMD --simulate UniwareCore/src/main/java/com/uniware/core/entity/ItemType.java"
          fi

          echo "Running: $CMD"
          eval $CMD || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-regression-report
          path: |
            .cache/regression-report.json
            .cache/regression-report.md
            tests/generated/regression/
