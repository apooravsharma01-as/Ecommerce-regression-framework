name: Regression Agent

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Intelligence Layer
        run: npm run impact:test

      - name: Run Regression Agent (analyze + generate, no execute)
        run: npm run regression:analyze -- --story "GST validation changed for product creation"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-artifacts
          path: |
            .cache/regression-report.json
            tests/generated/regression/
